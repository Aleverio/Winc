[package]
name = "winct-plugin"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Sandboxed WebAssembly plugin runtime for Winct"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "51", default-features = false, features = ["runtime", "cranelift", "std", "wat"] }
winct-plugin-api.workspace = true

[dev-dependencies]
wat = "1"

[lints]
workspace = true

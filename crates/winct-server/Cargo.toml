[package]
name = "winct-server"
description = "运行在远端主机上的服务进程：经标准输入输出为本机的 winct 执行文件操作。"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
winct-backend.workspace = true
# 远端搜索：服务进程以 `search` 为参数再次运行自身，在远端遍历目录并匹配。
winct-search.workspace = true
# 监视打开的目录：服务进程以 `watch <目录>` 为参数再次运行自身。
winct-watch.workspace = true

[lints]
workspace = true

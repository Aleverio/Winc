[package]
name = "dscode-lsp"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dipankar/dscode"
description = "Language Server Protocol client, manager, and connection pool for DSCode"

[dependencies]
lsp-types = "0.94"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

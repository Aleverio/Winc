# Build checks: rustfmt, and clippy (warnings fail), the tests, and the documentation build
# (warnings fail) on macOS, Linux, and Windows, for pull requests into `dev` and for every push to
# `dev`. Pull requests that change only documentation or repository templates skip the builds.
#
# Pull requests into `main` come only from `dev`, so they are not built again: a required check is
# matched on the pull request's head commit, and the push to `dev` already checked that commit.
#
# Clippy with the documentation build, and the tests, run as separate jobs on each platform, so
# that neither waits for the other.
#
# Caches: a pull request can read caches saved by its own branch or by `dev`, but not by other pull
# requests. Pushes to `dev` save the dependency cache and pull requests only restore it, so they
# recompile little more than the workspace crates. Each job keeps its own cache: Clippy and the
# documentation build need only the metadata of the dependencies, the tests need them compiled.
#
# "CI" collects the results. It is the check to require in the branch rules, because skipped jobs
# do not report the names that a rule expects.

name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# A new commit on the same pull request or branch cancels the checks still running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Dependencies need no debug information; builds are faster and caches smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Any change outside the paths listed below counts as code. Pushes to `dev` and manual runs
      # always build, so that the cache stays current.
      - name: Changed files
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code="$(git diff --name-only "${BASE}...${HEAD}" -- . \
            ':!*.md' ':!LICENSE' ':!NOTICE' ':!.github/ISSUE_TEMPLATE/' \
            ':!.github/workflows/cla.yml' ':!.github/workflows/commits.yml')"
          echo "code=$([[ -n "${code}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Formatting is the same on every platform, so it is checked once, on Linux.
  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Installs the version and components named in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - name: rustfmt
        run: cargo fmt --all --check

  # winctup is a shell/PowerShell payload served from this repository; keep its syntax, checksums
  # and offline tests green on the same push as the Rust workspace.
  runtime:
    name: Runtime
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Shell syntax and checksums
        run: |
          bash -n release/runtime/runtime.sh
          bash -n release/runtime/install.sh
          bash -n release/runtime/tests/runtime.test.sh
          node release/runtime/checksums.mjs --check

      - name: Offline runtime tests
        run: bash release/runtime/tests/runtime.test.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          foreach ($file in @('release/runtime/install.ps1', 'release/runtime/winctup.ps1', 'release/runtime/tests/winctup.test.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Offline PowerShell runtime tests
        shell: pwsh
        run: ./release/runtime/tests/winctup.test.ps1

  runtime-windows:
    name: Runtime (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Windows runtime tests and launcher shim
        shell: pwsh
        run: |
          ./release/runtime/tests/winctup.test.ps1
          $homeDir = Join-Path $env:RUNNER_TEMP 'winct-shim-home'
          $binDir = Join-Path $env:RUNNER_TEMP 'winct-shim-bin'
          $runtimeDir = Join-Path $homeDir 'runtime'
          New-Item -ItemType Directory -Force -Path $runtimeDir, $binDir | Out-Null
          Copy-Item ./release/runtime/winctup.ps1 (Join-Path $runtimeDir 'winctup.ps1') -Force
          . ./release/runtime/winctup.ps1 -HomeDir $homeDir -BinDir $binDir
          Write-Launchers
          & (Join-Path $binDir 'winctup.cmd') help -Channel beta
          if ($LASTEXITCODE -ne 0) { throw "winctup.cmd failed with exit $LASTEXITCODE" }

  lint:
    name: lint (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15-intel
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    steps:
      # On Windows, Git converts line endings to CRLF by default, which changes the language
      # bundles, shell scripts, and test samples; the tests compare LF.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # Installs the version and components named in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15-intel
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    steps:
      # On Windows, Git converts line endings to CRLF by default, which changes the language
      # bundles, shell scripts, and test samples; the tests compare LF.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # Installs the version and components named in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # The terminal tests start the installed shells (zsh and fish are skipped when missing); the
      # font tests need a monospace font and a CJK font.
      #
      # The package files are cached for each runner image: the CJK font is 61 MB, and the Ubuntu
      # mirror at times serves it at about 100 kB/s, which held this step for ten minutes. With the
      # files restored, nothing is downloaded.
      - name: Runner image version
        if: runner.os == 'Linux'
        id: image
        run: echo "version=${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore Linux packages
        if: runner.os == 'Linux'
        id: packages
        uses: actions/cache@v6
        with:
          path: ~/linux-packages
          key: linux-packages-${{ steps.image.outputs.version }}-zsh-fish-dejavu-noto-cjk

      # The restored files go back to the archive directory of apt, which then installs them
      # without the network: apt reads package files as an unprivileged user that has no access
      # to the home directory, so files named there are downloaded again instead. Restored files
      # that no longer install (they are missing a dependency, say) are replaced by a fresh
      # download.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        env:
          RESTORED: ${{ steps.packages.outputs.cache-hit }}
          PACKAGES: zsh fish fonts-dejavu-core fonts-noto-cjk
        run: |
          if [[ "${RESTORED}" == true ]] \
            && sudo cp ~/linux-packages/*.deb /var/cache/apt/archives/ \
            && sudo apt-get install -y --no-install-recommends --no-download ${PACKAGES}; then
            exit 0
          fi
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --download-only ${PACKAGES}
          rm -rf ~/linux-packages
          mkdir -p ~/linux-packages
          cp /var/cache/apt/archives/*.deb ~/linux-packages/
          sudo apt-get install -y --no-install-recommends ${PACKAGES}

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      # The step above runs on the system's ConPTY; this one repeats the end-to-end tests on the
      # version the installers ship. The files are removed so the build cache never holds them.
      - name: Test the bundled console host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./release/windows/conpty.ps1 -Destination target/debug
          cargo test -p winct-pty --test windows --locked --no-fail-fast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item target/debug/conpty.dll, target/debug/OpenConsole.exe

  result:
    name: CI
    if: always()
    needs: [changes, format, runtime, lint, test]
    runs-on: ubuntu-24.04
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          [[ ! " ${RESULTS} " =~ \ (failure|cancelled)\  ]]

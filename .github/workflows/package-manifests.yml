name: Package manifests

# Turn a published GitHub Release into package-manager manifests. The release assets are the single
# source of truth: every URL and SHA-256 in the generated files comes from the bytes uploaded to the
# release, so a new stable release updates AUR, Homebrew, Scoop and winget without hand edits.
#
# External repositories are optional. Without tokens the workflow still generates and commits the
# manifests in this repository, and the maintainer can copy them from `packaging/generated`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published stable release tag (for example v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-manifests
  cancel-in-progress: false

jobs:
  manifests:
    name: Generate and publish manifests
    if: >-
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'v') &&
       !github.event.release.prerelease) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a stable release tag, got %s\n' "$TAG" >&2
            exit 1
          fi

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release download "$TAG" --dir release-assets --repo "$GH_REPO"

      - name: Render manifests
        shell: bash
        run: |
          set -euo pipefail
          node release/common/package-manifests.mjs \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --assets release-assets \
            --out packaging/generated
          find packaging/generated -type f -print | sort

      - name: Open a pull request with the generated manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch="packaging/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -f packaging/generated
          if git diff --cached --quiet; then
            printf 'Generated manifests are already up to date.\n'
            exit 0
          fi
          git commit -m "chore: update package manifests for $TAG"
          git push --force origin "HEAD:$branch"
          if [[ -z $(gh pr list --head "$branch" --state open --json number --jq '.[0].number') ]]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "Package manifests for $TAG" \
              --body "Generated from https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG by the package-manifests workflow."
          fi

      - name: Sync to package repositories
        env:
          WINC_PACKAGE_TARGETS: |
            AUR|${{ vars.AUR_REPO || 'Aleverio/winct-aur' }}|.|AUR_TOKEN
            HOMEBREW|${{ vars.HOMEBREW_TAP || 'Aleverio/homebrew-winct' }}|.|HOMEBREW_TAP_TOKEN
            SCOOP|${{ vars.SCOOP_BUCKET || 'Aleverio/scoop-winct' }}|bucket|SCOOP_BUCKET_TOKEN
            WINGET|${{ vars.WINGET_FORK || 'Aleverio/winget-pkgs' }}|manifests/a/Aleverio/Winct/{{VERSION}}|WINGET_TOKEN
          AUR_TOKEN: ${{ secrets.AUR_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: bash
        run: bash release/common/sync-packages.sh packaging/generated "${TAG#v}"

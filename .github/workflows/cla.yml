# Contributor License Agreement: manual, silent status check.
#
# This workflow never runs automatically for pull requests and never posts comments. It exists only
# so a maintainer can refresh the "CLA" commit status on demand without notifying anyone. Signatures
# are read from signatures/cla.json on the `cla-signatures` branch.

name: CLA

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Number of the pull request whose CLA status should be refreshed
        required: true
        type: number

permissions:
  contents: read
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const number = Number(context.payload.inputs?.pull_request);
            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed("Give a valid pull request number.");
              return;
            }
            const { owner, repo } = context.repo;
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            const documentUrl = `https://github.com/${owner}/${repo}/blob/HEAD/.github/CLA.md`;

            let signedIds = new Set();
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path: "signatures/cla.json", ref: "cla-signatures",
              });
              const signatures = JSON.parse(Buffer.from(data.content, "base64").toString("utf8"));
              signedIds = new Set(signatures.signedContributors.map((entry) => entry.id));
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const signed = signedIds.has(pr.user.id);
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, context: "CLA", target_url: documentUrl,
              state: signed ? "success" : "failure",
              description: signed ? "CLA signed" : "CLA not signed",
            });
            core.info(`CLA status for pull request #${number}: ${signed ? "signed" : "not signed"}.`);
